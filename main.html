<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>
    <link rel="stylesheet" href="watch.css">
    <link rel="shortcut icon" href="hourglass-regular.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Bentham">
</head>

<body>
    <header>
        <nav>
            <!-- <button class="timer-btn nav-btns"><i class="fa-solid fa-hourglass"></i>Timer</button> -->
            <button class="swatch-btn"><i class="fa-solid fa-stopwatch"></i>Stop Watch</button>
            <button class="volume-btn nav-btns"><i class="fa-solid fa-volume-high"></i></button>
        </nav>
    </header>
    <main>
        <article>
            <div class="timer-box">00.00</div>
        </article>
    </main>
    <footer>
        <button class="play-btn"><i class="fa-solid fa-play"></i></button>
        <button class="pause-btn footer-btns"><i class="fa-solid fa-pause"></i></button>
        <button class="reset-btn footer-btns"><i class="fa-solid fa-arrow-rotate-left"></i></button>
    </footer>

    <script src="watch.js"></script>
</body>

</html>
