<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>
    <link rel="stylesheet" href="watch.css">
    <link rel="shortcut icon" href="stopwatch-solid.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Bentham">
</head>

<body>
    <header>
        <nav>
            <button class="swatch-btn"><i class="fa-solid fa-stopwatch fa-spin-snap-4"></i> Stop Watch</button>
            <button class="volume-btn nav-btns"><i class="fa-solid fa-volume-high"></i></button>
        </nav>
    </header>
    <main>
        <svg width="640" height="480" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
            <!-- Created with SVG-edit - https://github.com/SVG-Edit/svgedit-->
            <g class="layer" display="inline">
                <ellipse fill="none" stroke="none" stroke-width="5" cx="300.35" cy="252.19" rx="150.5" ry="150.5"
                    class="circle" id="svg_1" />
                <text x="300.35" y="252.19" text-anchor="middle" dominant-baseline="middle" fill="black" font-size="50"
                    class="timer-box">00.00</text>
                <ellipse fill="none" class="mini-ball" cx="300.62" cy="100.15" rx="14" ry="14" id="svg_5" />
            </g>
        </svg>
    </main>
    <footer>
        <button class="play-btn"><i class="fa-solid fa-play"></i></button>
        <button class="pause-btn footer-btns"><i class="fa-solid fa-pause"></i></button>
        <button class="reset-btn footer-btns"><i class="fa-solid fa-arrow-rotate-left"></i></button>
    </footer>

    <script src="watch.js"></script>
</body>

</html>
